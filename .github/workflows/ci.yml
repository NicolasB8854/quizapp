name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install (Root-Workspaces inkl. server/ und packages/shared)
        run: npm ci
      - name: Typecheck (App + Shared)
        run: npm run typecheck
      - name: Typecheck (Server)
        run: npm run server:typecheck
      - name: Tests (inkl. Multi-Device-Test)
        run: npm test
      - name: Build Frontend
        run: npx vite build
      - name: Build Lambda
        run: npm run server:build
      - name: E2E-Klicktest (3 Geräte, Chrome des Runners)
        run: npm run e2e
